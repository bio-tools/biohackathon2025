[project]
name = "metadata-bridge"
version = "0.1.0"
description = "Bidirectional metadata bridge between GitHub repositories and bio.tools"
authors = [
    {name = "Mariia Steeghs-Turchina"},
    {name = "Anna Niehues"},
    {name = "Veit Schwämmle"},
    {name = "Magnus Palmblad"},
    {name = "Ana Mendes"}
]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["bio.tools", "github", "metadata", "bioinformatics", "research software", "edam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic (>=2.12.3,<3.0.0)",
    "pydantic-core (>=2.41.4,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "packaging (>=25.0)",
    "fastapi (>=0.120.4,<0.121.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "typer (>=0.20.0,<0.21.0)",
    "huggingface-hub (>=1.0.1,<2.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/bio-tools/metadata-bridge"
Documentation = "https://bio-tools.github.io/metadata-bridge/"
Repository = "https://github.com/bio-tools/metadata-bridge"
Issues = "https://github.com/bio-tools/metadata-bridge/issues"
Changelog = "https://github.com/bio-tools/metadata-bridge/blob/dev/CHANGELOG.md"

[project.scripts]
bridge = "bridge.__main__:main_app"

[tool.poetry.group.dev.dependencies]
datamodel-code-generator = "^0.35.0"
ruff = "^0.14.2"
black = "^25.9.0"
pre-commit = "^4.3.0"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
pytest-httpx = "^0.35.0"
pytest-cov = "^7.0.0"
cosmic-ray = "^8.4.3"
poethepoet = "^0.49.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
sphinx-autodoc-typehints = "^3.5.2"
myst-parser = "^4.0.1"
sphinx-book-theme = "^1.1.4"
sphinx-automodapi = "^0.20.0"
grimp = "^3.12"
sphinxcontrib-mermaid = "^1.2.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "bridge", from = "src" }]

# dev-only helpers: run with `poetry run poe <task>` (not shipped in the package)
[tool.poe.tasks]
lint = { script = "scripts.quality:lint", help = "Ruff + Black checks" }
fmt = { script = "scripts.quality:fmt", help = "Fix with Ruff, format with Black" }
coverage-report = { script = "scripts.quality:coverage_report", help = "Run tests with HTML coverage report" }
cosmic-ray-report = { script = "scripts.quality:cosmic_ray_report", help = "Run mutation testing report" }
gen-biotools-models = { script = "scripts.gen_models:generate_biotools_models", help = "Regenerate bio.tools models" }
gen-github-models = { script = "scripts.gen_models:generate_github_models", help = "Regenerate GitHub models" }
gen-docs = { script = "scripts.gen_docs:main", help = "Build Sphinx docs" }
gen-diagrams = { script = "scripts.gen_diagrams:main", help = "Generate architecture diagrams" }
gen-process-diagrams = { script = "scripts.gen_process_diagrams:main", help = "Generate process diagrams" }


