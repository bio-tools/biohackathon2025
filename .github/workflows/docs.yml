name: Build & Deploy Docs

# PRs only build the docs (to catch breakage); nothing is deployed from them.
# Pushes to the deploy branch publish to GitHub Pages. That branch is the repo
# variable DOCS_DEPLOY_BRANCH, defaulting to `dev`; set it to `main` once
# releases are cut from main.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

# one run per ref; a newer push to the same branch replaces a pending one
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install deps (main + docs)
        run: |
          poetry install --no-interaction --no-ansi --with docs

      - name: Install d2 (pinned)
        run: |
          set -eux
          D2_VERSION=v0.7.1
          curl -L "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" -o d2.tgz
          tar -xzf d2.tgz
          sudo install -m 0755 "d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version

      - name: Generate architecture diagrams
        env:
          PYTHONPATH: src
        run: |
          poetry run poe gen-diagrams

      - name: Build Sphinx HTML
        run: |
          poetry run poe gen-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    if: >
      github.event_name != 'pull_request' &&
      github.ref_name == (vars.DOCS_DEPLOY_BRANCH || 'dev')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
